name: Refresh videos

on:
  schedule:
    # every two hours, off the hour — GitHub's scheduler is busiest at :00
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# a manual run and a scheduled one both push to main; let the second wait
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape the creator feed
        run: python3 tools/refresh.py

      - name: Commit any changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # --porcelain over `git diff`, which misses newly downloaded clips
          # because they're untracked until they're staged
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Refresh videos"
          # a push can lose a race with a commit made while this run was scraping
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
